  <text x="52" y="171" fill="#faf8f1" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-4">Baskar R<tspan fill="#8faeff">.</tspan></text>
  <text x="56" y="234" fill="#faf8f1" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="500" letter-spacing="-.9">Useful AI.</text>
