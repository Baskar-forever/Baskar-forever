    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8caaff"/><stop offset=".48" stop-color="#547cf2"/><stop offset="1" stop-color="#355dcc"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d2f7e6"/><stop offset=".55" stop-color="#9ce0c9"/><stop offset="1" stop-color="#65b89e"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffcfb6"/><stop offset=".5" stop-color="#f7aa8a"/><stop offset="1" stop-color="#dc8269"/></linearGradient>
    <filter id="shadow" x="-45%" y="-35%" width="200%" height="220%"><feDropShadow dx="0" dy="20" stdDeviation="13" flood-color="#030a19" flood-opacity=".5"/></filter>
    <radialGradient id="pool"><stop stop-color="#698ce0" stop-opacity=".2"/><stop offset="1" stop-color="#698ce0" stop-opacity="0"/></radialGradient>
  </defs>
