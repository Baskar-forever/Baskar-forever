<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Baskar R, Applied AI Engineer</title>
  <desc id="desc">Useful AI, built beyond the conversation. Blue, mint, and coral three-dimensional tiles represent agents, retrieval, and voice.</desc>
  <defs>
